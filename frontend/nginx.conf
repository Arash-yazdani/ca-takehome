server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's DNS, re-read every 5 seconds, so a restarted backend with a new IP is found again.
  resolver 127.0.0.11 valid=5s;

  # The browser only talks to this origin, so the API needs no CORS setup.
  location /api/ {
    set $backend http://backend:5000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;
    proxy_set_header Host $host;
    # Fail fast, so the UI can show the offline banner soon after a hang or an outage.
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  location / {
    try_files $uri /index.html;
  }
}
